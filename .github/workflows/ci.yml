name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bun = package manager + installer (เร็ว); node ยังจำเป็นสำหรับ runtime ของ
      # vitest/eslint (bun run จะเลือก node อัตโนมัติเมื่อมี node ในเครื่อง)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
  # YouTube บล็อก datacenter IP ของ GitHub runner (search/Lavalink → YouTube ใช้ไม่ได้)
  # E2E จึงรันแบบ informative เท่านั้น — verification จริงคือ local/dev machine
  # (ดู .scratch/phase-13-testing-production/spec.md Lessons และ perf/RESULTS.md)
  e2e-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start compose stack (postgres + lavalink + resolver + server + web)
        run: docker compose up -d --build
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T web wget -qO- http://server:3001/health | grep -q ok; then
              echo "stack ready"; exit 0
            fi
            sleep 2
          done
          echo "stack not ready"; docker compose logs --tail 50; exit 1
      - name: Warm up resolver (cold resolve ก่อน E2E)
        run: |
          chmod +x apps/web/e2e/warmup.sh
          bash apps/web/e2e/warmup.sh
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E smoke (chromium)
        run: bun run e2e
        working-directory: apps/web
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
