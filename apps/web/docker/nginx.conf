server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # same-origin API proxy — ไม่มี trailing slash เพื่อคง path เต็ม (/api/v1/...)
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # สำคัญสำหรับ /stream: client ปิด connection ต้องส่งต่อทันที + ไม่ buffer เสียง
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    # Socket.IO (websocket.md) — path /ws ต้อง proxy upgrade ให้ server
    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
