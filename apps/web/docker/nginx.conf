server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # security.md §6/§10 — CSP เข้ม + security headers ฝั่ง SPA
    # (เสียงมาจาก origin เราเท่านั้น — media-src 'self'; ปกจาก YouTube — img-src https:)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # same-origin API proxy — ไม่มี trailing slash เพื่อคง path เต็ม (/api/v1/...)
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # สำคัญสำหรับ /stream: client ปิด connection ต้องส่งต่อทันที + ไม่ buffer เสียง
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }

    # Socket.IO (websocket.md) — path /ws ต้อง proxy upgrade ให้ server
    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
