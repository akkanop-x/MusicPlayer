# Lavalink v4.2.2 — verified กับ application.yml.example ของ tag 4.2.2 (docs/lavalink.md §2.2 บังคับ)
# บทบาทของ Lavalink ในโปรเจกต์นี้: search/metadata เท่านั้น (lavalink.md §1, ADR-008)
# ค่า secret ทั้งหมดมาจาก env — ห้าม hardcode
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube ถูกถอดออกจาก core แล้ว — source หลัก MVP ตาม ADR-008/009
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # built-in youtube deprecated — ใช้ youtube-source plugin ด้านบนแทน
      youtube: false
      bandcamp: true
      soundcloud: true # ยังไม่ search หลัง MVP (lavalink.md §5) แต่เปิด source ไว้ไม่มีผล
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false # เราไม่ใช้ local บน Lavalink host (zero storage — ADR-008)
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

# plugin config อยู่ที่ ROOT `plugins:` — YES plugins IS AT ROOT (README ของ Lavalink/plugins ทุกตัว)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 2
